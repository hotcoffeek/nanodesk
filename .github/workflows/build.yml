name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk NanoDesk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NanoDesk-apk
          path: NanoDesk.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NanoDesk APK (latest)
          files: NanoDesk.apk
          make_latest: true
